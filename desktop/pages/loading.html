<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>JOUD</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#0f1a2e;color:#fff;font-family:Tahoma,Segoe UI,sans-serif}
.box{text-align:center}.logo{font-size:56px;font-weight:700;letter-spacing:6px}.msg{margin-top:18px;opacity:.85;font-size:15px;min-height:22px}
.bar{width:220px;height:3px;background:#ffffff26;margin:22px auto 0;overflow:hidden;border-radius:2px}.bar i{display:block;height:100%;width:40%;background:#c9a24a;animation:m 1.2s infinite ease-in-out}
@keyframes m{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
</style></head><body><div class="box"><div class="logo">JOUD</div><div class="msg" id="m">جارٍ التشغيل…</div><div class="bar"><i></i></div></div>
<script>if(window.joudDesktop)joudDesktop.onStatus(function(t){document.getElementById('m').textContent=t});</script></body></html>
